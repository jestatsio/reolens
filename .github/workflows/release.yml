name: Release

# Tag-driven release pipeline. Push `v0.1.0` (etc.) and this workflow
# uploads BOTH platforms to App Store Connect / TestFlight under ONE
# multiplatform app record (shared bundle id com.reolens.Reolens):
#   • mac-testflight — archives the ReolensMac scheme, exports a signed
#     .pkg, uploads it to the Mac App Store / TestFlight.
#   • ios-testflight — archives the ReolensiOS scheme, exports a signed
#     .ipa, uploads it to TestFlight.
# The two run in parallel and are independent.
#
# 0.7.0 retired the macOS Developer-ID DMG + Sparkle pipeline: the Mac app
# now ships exclusively through the App Store (it updates via the store,
# not Sparkle), and iOS + macOS live under one App Store Connect record.
#
# Required secrets (Settings → Secrets):
#   AC_API_KEY_ID                 — App Store Connect API key ID
#   AC_API_ISSUER_ID              — App Store Connect issuer UUID
#   AC_API_KEY_P8_BASE64          — base64 of the .p8 key file (Admin role)
#   IOS_DIST_CERT_P12_BASE64      — Apple Distribution cert (.p12 base64).
#                                   The unified cert signs BOTH the iOS
#                                   .ipa and the macOS .app.
#   IOS_DIST_CERT_PASSWORD        — password for that .p12
#   MAC_INSTALLER_CERT_P12_BASE64 — "3rd Party Mac Developer Installer"
#                                   cert (.p12 base64); signs the macOS
#                                   .pkg installer. NEW in 0.7.0.
#   MAC_INSTALLER_CERT_PASSWORD   — password for that .p12
#   KEYCHAIN_PASSWORD             — arbitrary password for the temporary
#                                   build keychain CI creates
#
# Required repo variables:
#   TEAM_ID                       — the 10-char Apple Developer team ID

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # macOS TestFlight upload. Archives the native macOS app (ReolensMac)
  # and ships it to the Mac App Store / TestFlight under the SAME app
  # record as iOS. Runs in parallel with ios-testflight; the two are
  # independent.
  #
  # Prereqs (one-time, in App Store Connect / Developer portal):
  #   - Bundle ID com.reolens.Reolens registered under Identifiers
  #     (with iCloud + App Groups + Push), shared by the iOS + macOS apps.
  #   - One multiplatform app record under My Apps for that bundle ID,
  #     with the macOS platform added.
  #   - The ASC API key has Admin role.
  #   - A "3rd Party Mac Developer Installer" cert exists; export it as a
  #     .p12 into MAC_INSTALLER_CERT_P12_BASE64 / MAC_INSTALLER_CERT_PASSWORD.
  mac-testflight:
    name: macOS TestFlight upload
    runs-on: macos-26
    timeout-minutes: 45
    env:
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
      AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      MAC_INSTALLER_CERT_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
      MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      TEAM_ID: ${{ vars.TEAM_ID }}

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # macOS only needs the macosx SDK (every Xcode 26.x ships it), so —
      # unlike the iOS lane — we don't have to exclude 26.5; just pick the
      # newest non-beta Xcode 26.x. We still pin DEVELOPER_DIR + PATH so a
      # preinstalled beta Xcode on the runner doesn't get used.
      - name: Select newest Xcode 26
        run: |
          XCODE_PATH=$(
            find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' \
              | grep -vi beta \
              | sort -V \
              | tail -n 1
          )
          if [ -z "$XCODE_PATH" ]; then
            echo "No non-beta Xcode 26.x found." >&2
            ls /Applications/ | grep -i Xcode || true
            exit 1
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          echo "$XCODE_PATH/Contents/Developer/usr/bin" >> "$GITHUB_PATH"

      - name: Show available macOS SDKs (diagnostic)
        run: xcodebuild -showsdks | grep -i macos

      # AGENTS.md §13: macOS + iOS MARKETING_VERSION must align before a
      # tag is allowed to release. Release-blocking if they drift.
      - name: Verify macOS / iOS versions align
        run: ./Scripts/check-versions.sh

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install Python deps for ASC API
        # macos-26 ships pip < 23 (no --break-system-packages); use a venv
        # and prepend its bin so Scripts/asc_ensure_profile.py's python3
        # shebang picks up pyjwt + cryptography.
        run: |
          set -euo pipefail
          python3 -m venv /tmp/ascvenv
          /tmp/ascvenv/bin/pip install --quiet pyjwt cryptography
          echo "/tmp/ascvenv/bin" >> "$GITHUB_PATH"

      # macOS App Store needs TWO identities: "Apple Distribution" (signs
      # the .app — the same unified cert iOS uses, reused from
      # IOS_DIST_CERT_*) and "3rd Party Mac Developer Installer" (signs the
      # .pkg installer). Import both into one temp keychain.
      - name: Import signing certs (app + installer)
        env:
          APP_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          APP_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="build.keychain"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security default-keychain -s "${KEYCHAIN}"
          security set-keychain-settings -lut 7200 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          echo "${APP_P12_BASE64}" | base64 -D > /tmp/mac-app-cert.p12
          security import /tmp/mac-app-cert.p12 -k "${KEYCHAIN}" \
            -P "${APP_P12_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/security
          echo "${INSTALLER_P12_BASE64}" | base64 -D > /tmp/mac-installer-cert.p12
          security import /tmp/mac-installer-cert.p12 -k "${KEYCHAIN}" \
            -P "${INSTALLER_P12_PASSWORD}" -T /usr/bin/productbuild -T /usr/bin/security
          rm -f /tmp/mac-app-cert.p12 /tmp/mac-installer-cert.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security find-identity -v "${KEYCHAIN}" | grep -i "Apple Distribution" || {
            echo "::error::Apple Distribution identity not visible after import" >&2
            exit 1
          }
          security find-identity -v "${KEYCHAIN}" | grep -i "Mac Developer Installer" || \
            echo "::warning::Mac installer identity not visible — .pkg signing may fail"

      - name: Bump CURRENT_PROJECT_VERSION to GitHub run number
        # TestFlight rejects duplicate build numbers, so stamp every
        # CURRENT_PROJECT_VERSION with the monotonically-increasing run
        # number. Only the ReolensMac target is built + uploaded here.
        run: |
          set -euo pipefail
          sed -i.bak -E "s/CURRENT_PROJECT_VERSION: \"[0-9]+\"/CURRENT_PROJECT_VERSION: \"${GITHUB_RUN_NUMBER}\"/g" AppiOS/project.yml
          rm -f AppiOS/project.yml.bak

      - name: Build + upload to TestFlight
        run: ./Scripts/build-mac.sh upload

  # iOS TestFlight upload. Runs in parallel with the macOS
  # `mac-testflight` job; the two are independent. Reuses the same App
  # Store Connect API key (`AC_API_KEY_*` secrets); the key is scoped to
  # the team, not a single app, so it covers both platforms' uploads as
  # long as it has Admin role (required by xcodebuild for
  # provisioning-profile auto-creation).
  #
  # Prereqs (one-time, done in App Store Connect UI):
  #   - Bundle ID com.reolens.Reolens registered under Identifiers.
  #   - An app record created under My Apps with that bundle ID.
  #   - The ASC API key has Admin role.
  #
  # See docs/IOS_RELEASE.md for the full walkthrough.
  ios-testflight:
    name: iOS TestFlight upload
    runs-on: macos-26
    timeout-minutes: 30
    env:
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
      AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
      # 0.5.0 — Apple Distribution cert + private key for iOS
      # signing. Without this, `xcodebuild archive` fails with
      # "Provisioning profile does not include signing certificate"
      # because the runner has no usable identity for the bundle
      # the profile references.
      #
      # Two paths:
      #   1. Set IOS_CERTIFICATE_P12_BASE64 (+ IOS_CERTIFICATE_PASSWORD)
      #      to a dedicated iOS-only .p12.
      #   2. Reuse MACOS_CERTIFICATE_P12_BASE64 if the maintainer's
      #      .p12 already contains BOTH identities (common when the
      #      .p12 was exported from Keychain with all identities
      #      selected).
      #
      # The "Import iOS signing cert" step below tries the dedicated
      # secret first, falls back to the macOS one.
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      TEAM_ID: ${{ vars.TEAM_ID }}

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # The iOS job intentionally avoids Xcode 26.5 on GitHub's
      # macos-26 image. That image ships the 26.5 SDK, but not the
      # matching installed iOS device platform, so `generic/platform=iOS`
      # fails with "iOS 26.5 is not installed" during archive. Prefer the
      # newest non-beta Xcode 26.x below 26.5, which still satisfies the
      # iOS 26 deployment target and has a usable generic device platform.
      # The macOS `mac-testflight` job only needs the macosx SDK, so it
      # can use any non-beta Xcode 26.x (including 26.5).
      #
      # We previously tried `Xcode_16.app` (16.0 — the oldest available
      # on the runner) which omits the iOS device platform. The
      # alternative `xcodebuild -downloadPlatform iOS` fails on this
      # runner with "Unable to connect to simulator" — a known issue
      # where the downloader's progress reporter can't start
      # CoreSimulator. Picking a pre-stocked Xcode dodges all of that.
      - name: Select archive-compatible Xcode 26
        run: |
          # Skip beta Xcodes and Xcode 26.5 on this runner image.
          # Xcode_26.5.0.app currently lacks the downloadable iOS 26.5
          # device platform component required by archive destinations.
          XCODE_PATH=$(
            find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' \
              | grep -vi beta \
              | grep -Ev 'Xcode_26\.5([^0-9]|$)' \
              | sort -V \
              | tail -n 1
          )
          if [ -z "$XCODE_PATH" ]; then
            echo "No archive-compatible non-beta Xcode 26.x below 26.5 found." >&2
            echo "Reolens targets iOS 26.0; do not archive against brand-new Xcode 26.5 until GitHub's runner image has the matching iOS platform installed." >&2
            ls /Applications/ | grep -i Xcode || true
            exit 1
          fi
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          # GitHub's runner images preset BOTH `DEVELOPER_DIR` AND
          # PATH to the latest installed Xcode (often the beta).
          # `DEVELOPER_DIR` controls what xcodebuild does INTERNALLY
          # but not which `xcodebuild` binary gets executed in the
          # first place — that resolves via PATH. The runner's PATH
          # has Xcode_26.5_beta_2.app's bin dir first, so even with
          # the stable Xcode xcode-selected, `xcodebuild` (unqualified)
          # invokes the beta. Pin both env vars in $GITHUB_ENV so
          # every step + script in this job picks the right Xcode.
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          echo "$XCODE_PATH/Contents/Developer/usr/bin" >> "$GITHUB_PATH"

      - name: Show available iOS SDKs (diagnostic)
        run: xcodebuild -showsdks | grep -i ios

      # The Apple Distribution certificate (the one that signs App
      # Store / TestFlight builds) only exists in the maintainer's
      # local Keychain — Apple doesn't redistribute it from the
      # developer portal once it's been issued. Without it, xcodebuild's
      # manual signing step errors with:
      #
      #   error: No signing certificate "iOS Distribution" found:
      #   No "iOS Distribution" signing certificate matching team ID
      #   "5M9UT7VQ8Q" with a private key was found.
      #
      # Same .p12-import pattern the mac-testflight job uses for the
      # Apple Distribution cert — here with iOS-named secrets. (The same
      # unified Apple Distribution cert signs both the iOS .ipa and the
      # macOS .app; the two jobs import it under their own secret names.)
      - name: Import Apple Distribution signing cert
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="ios-build.keychain"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security default-keychain -s "${KEYCHAIN}"
          security set-keychain-settings -lut 7200 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          echo "${P12_BASE64}" | base64 -D > /tmp/ios-cert.p12
          security import /tmp/ios-cert.p12 -k "${KEYCHAIN}" \
            -P "${P12_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f /tmp/ios-cert.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          # Diagnostic — confirm the identity is now visible.
          security find-identity -v -p codesigning "${KEYCHAIN}" | grep -i "Apple Distribution" || {
              echo "::error::Apple Distribution identity not visible after import" >&2
              exit 1
          }

      # 0.5.0 — Import a signing cert into the runner keychain so
      # xcodebuild has the private key matching the Apple
      # Distribution cert that the provisioning profile references.
      # Without this, `xcodebuild -allowProvisioningUpdates` can't
      # produce a signed archive — the profile says "use cert X" but
      # the keychain has no key for cert X.
      #
      # Prefers a dedicated IOS_CERTIFICATE_P12_BASE64 secret, falls
      # back to MACOS_CERTIFICATE_P12_BASE64 (works when the
      # maintainer exported both identities into a single .p12 from
      # Keychain Access). Skips silently if neither is present —
      # build still tries with API-key-only signing.
      - name: Import iOS signing cert
        run: |
          set -euo pipefail
          if [[ -n "${IOS_CERTIFICATE_P12_BASE64:-}" ]]; then
            P12_BASE64="${IOS_CERTIFICATE_P12_BASE64}"
            P12_PASSWORD="${IOS_CERTIFICATE_PASSWORD:-}"
            echo "==> Importing IOS_CERTIFICATE_P12_BASE64 into runner keychain"
          elif [[ -n "${MACOS_CERTIFICATE_P12_BASE64:-}" ]]; then
            P12_BASE64="${MACOS_CERTIFICATE_P12_BASE64}"
            P12_PASSWORD="${MACOS_CERTIFICATE_PASSWORD:-}"
            echo "==> Falling back to MACOS_CERTIFICATE_P12_BASE64 (may contain both identities)"
          else
            echo "==> No iOS cert secret set — skipping import."
            echo "    If signing fails, add IOS_CERTIFICATE_P12_BASE64 +"
            echo "    IOS_CERTIFICATE_PASSWORD secrets."
            exit 0
          fi
          KEYCHAIN="build.keychain"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security default-keychain -s "${KEYCHAIN}"
          security set-keychain-settings -lut 7200 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          echo "${P12_BASE64}" | base64 -D > /tmp/ios-cert.p12
          security import /tmp/ios-cert.p12 -k "${KEYCHAIN}" \
            -P "${P12_PASSWORD}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm -f /tmp/ios-cert.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"

      # Diagnostic — print every codesigning identity the keychain
      # exposes to xcodebuild. We can correlate this output against
      # the certs visible in developer.apple.com to confirm the
      # profile's cert is reachable.
      - name: Dump available codesigning identities (diagnostic)
        run: |
          echo "==> Codesigning identities in default keychain:"
          security find-identity -v -p codesigning || true

      - name: Install xcodegen
        run: brew install xcodegen

      # PyJWT + cryptography power the pre-flight ASC API check in
      # Scripts/build-ios.sh. Without them the script skips the check
      # and we lose the diagnostic, falling back on xcodebuild's
      # generic "Authentication failed" if the key is misconfigured.
      - name: Install Python deps for pre-flight diagnostic
        # macos-26 runner ships pip < 23 (no --break-system-packages).
        # Install via a venv and prepend its bin dir to PATH so the
        # Python shebangs pick up the venv's python3 + modules.
        run: |
          set -euo pipefail
          python3 -m venv /tmp/ascvenv
          /tmp/ascvenv/bin/pip install --quiet pyjwt cryptography
          echo "/tmp/ascvenv/bin" >> "$GITHUB_PATH"

      - name: Bump CURRENT_PROJECT_VERSION to GitHub run number
        # MARKETING_VERSION stays at whatever the spec says (0.2.0, etc.);
        # CURRENT_PROJECT_VERSION must monotonically increase per upload
        # — App Store Connect rejects duplicates. Using ${GITHUB_RUN_NUMBER}
        # gives us a stable, increasing integer without committing back.
        run: |
          set -euo pipefail
          sed -i.bak "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"${GITHUB_RUN_NUMBER}\"/" AppiOS/project.yml
          rm AppiOS/project.yml.bak

      - name: Build + upload to TestFlight
        run: ./Scripts/build-ios.sh upload
